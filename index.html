<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ESP32-S3 Cruise Converter</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --line: #dde5ee;
      --text: #17202c;
      --muted: #637083;
      --dim: #96a1af;
      --accent: #2563eb;
      --accent-2: #f59e0b;
      --danger: #dc2626;
      --ok: #16a34a;
      --off: #d5dde6;
      --radius: 8px;
      --shadow: 0 12px 28px rgba(17, 24, 39, .08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.45;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text);
      padding: 12px 14px;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      border-color: rgba(37, 99, 235, .52);
      background: var(--accent);
      color: #f8fdff;
    }

    button.warn {
      border-color: rgba(245, 158, 11, .75);
      background: #fef3c7;
      color: #7c3d00;
    }

    button.danger {
      border-color: rgba(220, 38, 38, .75);
      background: #fee2e2;
      color: #8d1f1f;
    }

    input[type="number"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text);
      padding: 12px;
      min-height: 48px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre;
    }

    .app {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px 0 12px;
      background: rgba(246, 248, 251, .92);
      backdrop-filter: blur(12px);
    }

    .tab-button {
      min-height: 52px;
      padding: 8px 4px;
      color: var(--muted);
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(17, 24, 39, .05);
    }

    .tab-button.active {
      color: #ffffff;
      border-color: var(--accent);
      background: var(--accent);
    }

    main {
      display: grid;
      gap: 14px;
    }

    .view {
      display: none;
      gap: 14px;
    }

    .view.active {
      display: grid;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .panel h2,
    .panel h3 {
      margin: 0 0 12px;
      letter-spacing: 0;
    }

    .panel h2 {
      font-size: 21px;
      font-weight: 540;
    }

    .panel h3 {
      color: var(--muted);
      font-size: 16px;
      font-weight: 520;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metric {
      display: grid;
      min-height: 86px;
      align-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      padding: 12px;
    }

    .label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .value {
      overflow-wrap: anywhere;
      font-size: 26px;
      font-weight: 540;
      line-height: 1.1;
    }

    .value.small {
      font-size: 20px;
    }

    .status-pill {
      display: inline-grid;
      place-items: center;
      width: fit-content;
      min-width: 70px;
      min-height: 34px;
      border-radius: 999px;
      padding: 5px 11px;
      background: var(--off);
      color: #334155;
      font-size: 16px;
      font-weight: 520;
    }

    .status-pill.on {
      background: var(--ok);
      color: #ffffff;
    }

    .status-pill.warn {
      background: var(--accent-2);
      color: #1b1000;
    }

    .current-readout {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
    }

    .steering-layout {
      position: relative;
      display: grid;
      gap: 22px;
    }

    .switch-unit {
      display: grid;
      gap: 10px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 4px 0 12px;
    }

    .switch-unit + .switch-unit {
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }

    .steering-status {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      padding: 10px 2px 18px;
      margin-bottom: 6px;
    }

    .steering-status .metric-lite {
      display: grid;
      gap: 6px;
      min-width: 138px;
    }

    .steering-status .value {
      font-size: 30px;
    }

    .switch-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 520;
      text-transform: uppercase;
    }

    .switch-title-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch-face {
      position: relative;
      min-height: 318px;
      aspect-ratio: 1;
      border: 0;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 43%, rgba(37, 99, 235, .055) 44% 58%, transparent 59%);
      padding: 18px;
    }

    .switch-face::before {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 999px;
      border: 8px solid rgba(37, 99, 235, .075);
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .07);
      pointer-events: none;
    }

    .switch-face::after {
      content: "";
      position: absolute;
      inset: 94px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, .18);
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    .switch-grid {
      position: absolute;
      inset: 0;
    }

    .switch-item {
      position: absolute;
      z-index: 2;
      width: min(108px, 31vw);
      transform: translate(-50%, -50%);
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 4px;
    }

    .switch-item.u {
      left: 50%;
      top: 18%;
    }

    .switch-item.l {
      left: 22%;
      top: 50%;
    }

    .switch-item.c {
      left: 50%;
      top: 50%;
    }

    .switch-item.r {
      left: 78%;
      top: 50%;
    }

    .switch-item.d {
      left: 50%;
      top: 82%;
    }

    .learn-action {
      min-height: 42px;
      min-width: 86px;
      padding: 8px 12px;
      border-color: rgba(37, 99, 235, .35);
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
    }

    .switch-control {
      display: inline-grid;
      place-items: center;
      width: auto;
      min-height: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      box-shadow: none;
      padding: 4px 9px;
      text-align: center;
      color: var(--text);
      font: inherit;
      line-height: 1.2;
      transition: border-color .16s ease, background .16s ease, box-shadow .16s ease, transform .16s ease;
    }

    .switch-control.round {
      width: auto;
      min-height: 0;
      background: transparent;
    }

    .switch-control.learning {
      background: transparent;
      box-shadow: none;
      cursor: pointer;
    }

    .switch-control.learning:active {
      transform: scale(.98);
    }

    .switch-name {
      font-size: 17px;
      font-weight: 520;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .switch-control.learning {
      background: rgba(239, 246, 255, .95);
      box-shadow: 0 6px 16px rgba(37, 99, 235, .12);
      color: #1d4ed8;
    }

    .switch-meta {
      display: grid;
      justify-content: center;
      align-items: center;
      gap: 2px;
      text-align: center;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
    }

    .press-select {
      appearance: none;
      min-height: 22px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 0 2px;
      font: inherit;
      text-align: center;
      text-align-last: center;
      cursor: pointer;
    }

    .press-select:focus {
      outline: 2px solid rgba(37, 99, 235, .26);
      outline-offset: 2px;
      background: rgba(239, 246, 255, .9);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .message {
      min-height: 26px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 500;
    }

    .json-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    @media (min-width: 720px) {
      .app {
        padding-inline: 22px;
      }

      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .steering-layout {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }

      .switch-unit + .switch-unit {
        border-top: 0;
        border-left: 1px solid var(--line);
        padding-top: 4px;
        padding-left: 28px;
      }

      .switch-face {
        min-height: 340px;
      }

      .actions {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 380px) {
      .switch-face {
        min-height: 286px;
      }

      .switch-item {
        width: 92px;
      }

      .switch-control {
        padding: 4px 8px;
      }

      .switch-control.round {
        width: auto;
        min-height: 0;
      }

      .learn-action {
        min-width: 64px;
        font-size: 14px;
      }

      .switch-name {
        font-size: 15px;
      }

      .switch-meta {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="tabs" aria-label="画面切り替え">
      <button class="tab-button active" data-tab="monitor" type="button">Monitor</button>
      <button class="tab-button" data-tab="steering" type="button">Remote</button>
      <button class="tab-button" data-tab="system" type="button">System</button>
    </nav>

    <main>
      <section id="monitor" class="view active">
        <div class="panel">
          <h2>Input</h2>
          <div class="grid two">
            <div class="metric">
              <div class="label">ADC現在値</div>
              <div id="statusAdc" class="value">0</div>
            </div>
            <div class="metric">
              <div class="label">Vin</div>
              <div id="statusVin" class="value">0.0 V</div>
            </div>
            <div class="metric">
              <div class="label">Vout</div>
              <div id="statusVout" class="value">0.0 V</div>
            </div>
            <div class="metric">
              <div class="label">BrakeIn</div>
              <div id="statusBrakeIn" class="status-pill">OFF</div>
              <div id="currentBrakeIn" class="current-readout">0 mA</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>Outputs</h2>
          <div class="grid two grid three">
            <div class="metric">
              <div class="label">Main出力</div>
              <div id="outMain" class="status-pill">OFF</div>
              <div id="currentMain" class="current-readout">0 mA</div>
            </div>
            <div class="metric">
              <div class="label">Up/Set出力</div>
              <div id="outUpSet" class="status-pill">OFF</div>
              <div id="currentUpSet" class="current-readout">0 mA</div>
            </div>
            <div class="metric">
              <div class="label">Down/Res出力</div>
              <div id="outDownRes" class="status-pill">OFF</div>
              <div id="currentDownRes" class="current-readout">0 mA</div>
            </div>
            <div class="metric">
              <div class="label">Cancel出力</div>
              <div id="outCancel" class="status-pill">OFF</div>
              <div id="currentCancel" class="current-readout">0 mA</div>
            </div>
            <div class="metric">
              <div class="label">Brake疑似出力</div>
              <div id="outBrake" class="status-pill">OFF</div>
              <div id="currentBrakeOut" class="current-readout">0 mA</div>
            </div>
          </div>
        </div>
      </section>
      <section id="steering" class="view">
        <div class="steering-status">
          <div class="metric-lite">
            <div class="label">ADCin living</div>
            <div id="steeringAdc" class="value">0</div>
          </div>
          <div id="steeringMessage" class="message"></div>
        </div>

        <div class="steering-layout">
          <div class="switch-unit">
            <div class="switch-title">
              <span class="switch-title-main"><span>L</span></span>
              <button class="learn-action" data-learn-side="left" type="button">Learn</button>
            </div>
            <div class="switch-face">
              <div id="leftSwitches" class="switch-grid"></div>
            </div>
          </div>

          <div class="switch-unit">
            <div class="switch-title">
              <span class="switch-title-main"><span>R</span></span>
              <button class="learn-action" data-learn-side="right" type="button">Learn</button>
            </div>
            <div class="switch-face">
              <div id="rightSwitches" class="switch-grid"></div>
            </div>
          </div>
        </div>
      </section>
      <section id="system" class="view">
        <div class="panel">
          <h2>Device</h2>
          <div class="grid two">
            <div class="metric">
              <div class="label">Wi-Fi SSID</div>
              <div id="wifiSsid" class="value small">CC-S3</div>
            </div>
            <div class="metric">
              <div class="label">Wi-Fi Password</div>
              <div id="wifiPassword" class="value small">ccs3setup</div>
            </div>
            <div class="metric">
              <div class="label">IP</div>
              <div id="ipAddress" class="value small">192.168.4.1</div>
            </div>
            <div class="metric">
              <div class="label">Firmware Version</div>
              <div id="firmwareVersion" class="value small">0.1.0-ui</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>設定JSON</h2>
          <textarea id="configJson" spellcheck="false"></textarea>
          <div class="json-actions">
            <button id="exportConfig" type="button">エクスポート</button>
            <button id="importConfig" type="button">インポート</button>
            <button id="applyJson" class="primary" type="button">JSONを反映</button>
            <button id="resetConfig" class="danger" type="button">初期化</button>
          </div>
          <input id="importFile" class="file-input" type="file" accept="application/json,.json">
          <div id="systemMessage" class="message"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const STORAGE_KEY = "cruiseConverterConfig.v1";

    const defaultConfig = {
      learned: {
        rMain: 900,
        rCancel: 1350,
        rUpSet: 1800,
        rDownRes: 2250,
        lVolUp: 650,
        lVolDown: 1100,
        lSeekPlus: 1550,
        lSeekMinus: 2000,
        lMode: 2450
      },
      pressMs: {
        rMain: 700,
        rCancel: 200,
        rUpSet: 200,
        rDownRes: 200,
        lVolUp: 100,
        lVolDown: 100,
        lSeekPlus: 100,
        lSeekMinus: 100,
        lMode: 200
      }
    };

    const switchGroups = {
      left: [
        ["lVolUp", "U", "Vol+"],
        ["lSeekMinus", "L", "Seek-"],
        ["lMode", "C", "Mode"],
        ["lSeekPlus", "R", "Seek+"],
        ["lVolDown", "D", "Vol-"]
      ],
      right: [
        ["rDownRes", "U", "RES+"],
        ["rMain", "R", "Main"],
        ["rCancel", "C", "Cancel"],
        ["rUpSet", "D", "SET-"]
      ]
    };

    let config = loadConfig();
    let currentStatus = makeMockStatus();
    let learningSide = null;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadConfig() {
      const fallback = clone(defaultConfig);
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!stored) return fallback;
        return normalizeConfig(stored);
      } catch {
        return fallback;
      }
    }

    function normalizeConfig(next) {
      const pressMs = { ...defaultConfig.pressMs, ...(next.pressMs || {}) };
      Object.keys(pressMs).forEach((key) => {
        pressMs[key] = normalizePressMs(pressMs[key], defaultConfig.pressMs[key]);
      });
      return {
        learned: { ...defaultConfig.learned, ...(next.learned || {}) },
        pressMs
      };
    }

    function normalizePressMs(value, fallback = 0) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return fallback;
      const rounded = Math.round(numeric / 100) * 100;
      return Math.max(0, Math.min(5000, rounded));
    }

    async function apiGetStatus() {
      return makeMockStatus();
    }

    async function apiSaveConfig(nextConfig) {
      config = normalizeConfig(nextConfig);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
      return { ok: true };
    }

    async function apiResetConfig() {
      await apiSaveConfig(defaultConfig);
      return { ok: true };
    }

    function makeMockStatus() {
      const adc = 1800;
      const button = detectButton(adc);
      return {
        adc,
        button,
        vin: 12.2,
        vout: 5.0,
        brakeIn: false,
        outputs: {
          main: false,
          upSet: false,
          downRes: false,
          cancel: false,
          brakeOut: false
        },
        currents: {
          brakeIn: 0,
          main: 0,
          upSet: 0,
          downRes: 0,
          cancel: 0,
          brakeOut: 0
        }
      };
    }

    function detectButton(adc) {
      const labels = [
        ["Main", config.learned.rMain],
        ["Cancel", config.learned.rCancel],
        ["Up/Set", config.learned.rUpSet],
        ["Down/Res", config.learned.rDownRes],
        ["VolUp", config.learned.lVolUp],
        ["VolDown", config.learned.lVolDown],
        ["Seek+", config.learned.lSeekPlus],
        ["Seek-", config.learned.lSeekMinus],
        ["Mode", config.learned.lMode]
      ];
      const nearest = labels
        .map(([name, value]) => ({ name, diff: Math.abs(adc - Number(value)) }))
        .sort((a, b) => a.diff - b.diff)[0];
      return nearest && nearest.diff <= 90 ? nearest.name : "None";
    }

    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }

    function setPill(id, isOn) {
      const el = document.getElementById(id);
      el.textContent = isOn ? "ON" : "OFF";
      el.classList.toggle("on", Boolean(isOn));
    }

    function renderStatus(status) {
      currentStatus = status;
      setText("statusAdc", status.adc);
      setText("statusVin", `${status.vin.toFixed(1)} V`);
      setText("statusVout", `${status.vout.toFixed(2)} V`);
      setText("steeringAdc", status.adc);
      setPill("statusBrakeIn", status.brakeIn);
      setPill("outMain", status.outputs.main);
      setPill("outUpSet", status.outputs.upSet);
      setPill("outDownRes", status.outputs.downRes);
      setPill("outCancel", status.outputs.cancel);
      setPill("outBrake", status.outputs.brakeOut);
      renderCurrents(status.currents || {});
    }

    function renderCurrents(currents) {
      setCurrent("currentBrakeIn", currents.brakeIn);
      setCurrent("currentMain", currents.main);
      setCurrent("currentUpSet", currents.upSet);
      setCurrent("currentDownRes", currents.downRes);
      setCurrent("currentCancel", currents.cancel);
      setCurrent("currentBrakeOut", currents.brakeOut);
    }

    function setCurrent(id, value) {
      const numeric = Number(value);
      setText(id, `${Number.isFinite(numeric) ? numeric.toFixed(0) : "0"} mA`);
    }

    function renderSteeringSwitches() {
      document.getElementById("leftSwitches").innerHTML = switchGroups.left.map((item) => renderSwitchItem(item, "left")).join("");
      document.getElementById("rightSwitches").innerHTML = switchGroups.right.map((item) => renderSwitchItem(item, "right")).join("");
      document.querySelectorAll("[data-learn-side]").forEach((button) => {
        const side = button.dataset.learnSide;
        button.textContent = learningSide === side ? "Learning" : "Learn";
        button.classList.toggle("primary", learningSide === side);
      });
      document.querySelectorAll("[data-switch-key]").forEach((button) => {
        button.addEventListener("click", () => learnSwitchValue(button.dataset.switchSide, button.dataset.switchKey, button.dataset.switchName));
      });
      document.querySelectorAll("[data-press-key]").forEach((select) => {
        select.addEventListener("change", async () => {
          config.pressMs[select.dataset.pressKey] = normalizePressMs(select.value);
          await apiSaveConfig(config);
          renderSteeringSwitches();
          renderConfigJson();
          showMessage("steeringMessage", `${select.dataset.pressName} ${config.pressMs[select.dataset.pressKey]}ms`);
        });
      });
    }

    function startLearning(side) {
      learningSide = learningSide === side ? null : side;
      renderSteeringSwitches();
      showMessage("steeringMessage", learningSide ? `${side.toUpperCase()} learning` : "");
    }

    async function learnSwitchValue(side, key, name) {
      if (learningSide !== side) return;
      config.learned[key] = currentStatus.adc;
      learningSide = null;
      await apiSaveConfig(config);
      renderSteeringSwitches();
      renderConfigJson();
      showMessage("steeringMessage", `${side.toUpperCase()} ${name} = ${currentStatus.adc}`);
    }

    function renderSwitchItem([key, direction, name], side) {
      const positionClass = direction.toLowerCase();
      const roundClass = direction === "C" ? " round" : "";
      const learnClass = learningSide === side ? " learning" : "";
      return `
        <div class="switch-item ${positionClass}">
          <button class="switch-control${roundClass}${learnClass}" data-switch-side="${side}" data-switch-key="${key}" data-switch-name="${name}" type="button">
            <span class="switch-name">${name}</span>
          </button>
          <div class="switch-meta">
            <span>ADC${config.learned[key]}</span>
            <select class="press-select" data-press-key="${key}" data-press-name="${name}" aria-label="${name} press time">
              ${renderPressOptions(config.pressMs[key])}
            </select>
          </div>
        </div>
      `;
    }

    function renderPressOptions(selectedValue) {
      const selected = normalizePressMs(selectedValue);
      let html = "";
      for (let value = 0; value <= 5000; value += 100) {
        html += `<option value="${value}"${value === selected ? " selected" : ""}>${value}ms</option>`;
      }
      return html;
    }

    function renderConfigJson() {
      document.getElementById("configJson").value = JSON.stringify(config, null, 2);
    }

    function renderAll() {
      renderSteeringSwitches();
      renderConfigJson();
    }

    function showMessage(id, message) {
      const el = document.getElementById(id);
      el.textContent = message;
      window.clearTimeout(el._timer);
      el._timer = window.setTimeout(() => {
        el.textContent = "";
      }, 2600);
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.tab === tabId);
      });
      document.querySelectorAll(".view").forEach((view) => {
        view.classList.toggle("active", view.id === tabId);
      });
      if (tabId === "system") renderConfigJson();
    }

    function bindEvents() {
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.addEventListener("click", () => switchTab(button.dataset.tab));
      });

      document.querySelectorAll("[data-learn-side]").forEach((button) => {
        button.addEventListener("click", () => startLearning(button.dataset.learnSide));
      });

      document.getElementById("exportConfig").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(config, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "cruise-converter-config.json";
        link.click();
        URL.revokeObjectURL(url);
        showMessage("systemMessage", "エクスポートしました");
      });

      document.getElementById("importConfig").addEventListener("click", () => {
        document.getElementById("importFile").click();
      });

      document.getElementById("importFile").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const imported = JSON.parse(await file.text());
          await apiSaveConfig(imported);
          renderAll();
          showMessage("systemMessage", "インポートしました");
        } catch {
          showMessage("systemMessage", "JSONを読み込めません");
        } finally {
          event.target.value = "";
        }
      });

      document.getElementById("applyJson").addEventListener("click", async () => {
        try {
          const next = JSON.parse(document.getElementById("configJson").value);
          await apiSaveConfig(next);
          renderAll();
          showMessage("systemMessage", "JSONを反映しました");
        } catch {
          showMessage("systemMessage", "JSON形式を確認してください");
        }
      });

      document.getElementById("resetConfig").addEventListener("click", async () => {
        if (!confirm("設定を初期化しますか？")) return;
        await apiResetConfig();
        renderAll();
        showMessage("systemMessage", "初期化しました");
      });
    }

    async function startStatusLoop() {
      renderStatus(await apiGetStatus());
      window.setInterval(async () => {
        renderStatus(await apiGetStatus());
      }, 1000);
    }

    bindEvents();
    renderAll();
    startStatusLoop();
  </script>
</body>
</html>
