<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CC-S3 Cruise Unit</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --line: #dde5ee;
      --text: #17202c;
      --muted: #637083;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
      --off: #d5dde6;
      --radius: 8px;
      --shadow: 0 12px 28px rgba(17, 24, 39, .08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.45;
    }

    button, input, select, textarea { font: inherit; }

    button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text);
      padding: 12px 14px;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: translateY(1px); }

    button.primary {
      border-color: rgba(37, 99, 235, .52);
      background: var(--accent);
      color: #f8fdff;
    }

    button.danger {
      border-color: rgba(220, 38, 38, .75);
      background: #fee2e2;
      color: #8d1f1f;
    }

    input[type="number"], select, textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text);
      padding: 12px;
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre;
    }

    .app {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px 0 12px;
      background: rgba(246, 248, 251, .92);
      backdrop-filter: blur(12px);
    }

    .tab-button {
      min-height: 52px;
      padding: 8px 4px;
      color: var(--muted);
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(17, 24, 39, .05);
    }

    .tab-button.active {
      color: #ffffff;
      border-color: var(--accent);
      background: var(--accent);
    }

    main, .view {
      display: grid;
      gap: 14px;
    }

    .view { display: none; }
    .view.active { display: grid; }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 21px;
      font-weight: 540;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metric {
      display: grid;
      min-height: 86px;
      align-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      padding: 12px;
    }

    .label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .value {
      overflow-wrap: anywhere;
      font-size: 26px;
      font-weight: 540;
      line-height: 1.1;
    }

    .value.small { font-size: 20px; }

    .monitor-section {
      padding: 2px 2px 0;
      border-bottom: 1px solid var(--line);
    }

    .monitor-section:last-child {
      border-bottom: 0;
    }

    .monitor-section h2 {
      margin: 0;
      padding: 10px 0 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 560;
      letter-spacing: .02em;
    }

    .readout-list {
      display: grid;
      gap: 0;
    }

    .readout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 62px;
      padding: 11px 0;
      border-top: 1px solid var(--line);
    }

    .readout .label {
      font-size: 15px;
    }

    .readout .value {
      font-size: 28px;
      text-align: right;
    }

    .readout .status-pill {
      flex: 0 0 auto;
    }

    .status-pill {
      display: inline-grid;
      place-items: center;
      width: fit-content;
      min-width: 70px;
      min-height: 34px;
      border-radius: 999px;
      padding: 5px 11px;
      background: var(--off);
      color: #334155;
      font-size: 16px;
      font-weight: 520;
    }

    .status-pill.on {
      background: var(--ok);
      color: #ffffff;
    }

    .control-grid {
      display: grid;
      gap: 10px;
    }

    .steering-status {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      padding: 10px 2px 18px;
      margin-bottom: 14px;
    }

    .steering-status .value {
      font-size: 30px;
    }

    .learn-action {
      min-height: 42px;
      min-width: 86px;
      padding: 8px 12px;
      border-color: rgba(37, 99, 235, .35);
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
    }

    .learn-action.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .switch-face {
      position: relative;
      min-height: 318px;
      aspect-ratio: 1;
      max-width: 390px;
      margin: 0 auto;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 43%, rgba(37, 99, 235, .055) 44% 58%, transparent 59%);
      padding: 18px;
    }

    .switch-face::before {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 999px;
      border: 8px solid rgba(37, 99, 235, .075);
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, .07);
      pointer-events: none;
    }

    .switch-grid {
      position: absolute;
      inset: 0;
    }

    .switch-item {
      position: absolute;
      z-index: 2;
      width: min(112px, 30vw);
      transform: translate(-50%, -50%);
      display: grid;
      justify-items: center;
      text-align: center;
      gap: 4px;
    }

    .switch-item.u { left: 50%; top: 18%; }
    .switch-item.r { left: 78%; top: 50%; }
    .switch-item.c { left: 50%; top: 50%; }
    .switch-item.d { left: 50%; top: 82%; }

    .switch-control {
      display: inline-grid;
      place-items: center;
      min-height: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      box-shadow: none;
      padding: 4px 9px;
      text-align: center;
      color: var(--text);
      line-height: 1.2;
    }

    .switch-control.learning {
      background: rgba(239, 246, 255, .95);
      box-shadow: 0 6px 16px rgba(37, 99, 235, .12);
      color: #1d4ed8;
    }

    .switch-name {
      font-size: 17px;
      font-weight: 520;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .switch-meta {
      display: grid;
      justify-content: center;
      align-items: center;
      gap: 2px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      margin-top: 4px;
    }

    .switch-ms {
      min-height: 28px;
      width: 76px;
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
      border-color: rgba(99, 112, 131, .28);
      background: rgba(255, 255, 255, .88);
      font-size: 11px;
      text-align: center;
    }

    .control-button {
      min-height: 74px;
      font-size: 22px;
      background: #ffffff;
    }

    .control-button.cancel {
      border-color: rgba(220, 38, 38, .28);
      background: #fff7f7;
      color: #9f1d1d;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 10px;
      align-items: center;
    }

    .json-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .message {
      min-height: 26px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 500;
      margin-top: 10px;
    }

    @media (min-width: 720px) {
      .app { padding-inline: 22px; }
      .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid.four, .control-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .readout-list.two { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 26px; }
      .readout-list.four { grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="tabs" aria-label="画面切り替え">
      <button class="tab-button active" data-tab="monitor" type="button">Monitor</button>
      <button class="tab-button" data-tab="control" type="button">Control</button>
      <button class="tab-button" data-tab="system" type="button">System</button>
    </nav>

    <main>
      <section id="monitor" class="view active">
        <div class="monitor-section">
          <h2>Input</h2>
          <div class="readout-list two">
            <div class="readout">
              <div class="label">ADC GPIO4</div>
              <div id="statusAdc" class="value">0</div>
            </div>
            <div class="readout">
              <div class="label">Button</div>
              <div id="statusButton" class="value small">NONE</div>
            </div>
          </div>
        </div>

        <div class="monitor-section">
          <h2>Outputs</h2>
          <div class="readout-list four">
            <div class="readout">
              <div class="label">MAIN</div>
              <div id="outMain" class="status-pill">OFF</div>
            </div>
            <div class="readout">
              <div class="label">RES+</div>
              <div id="outRes" class="status-pill">OFF</div>
            </div>
            <div class="readout">
              <div class="label">SET-</div>
              <div id="outSet" class="status-pill">OFF</div>
            </div>
            <div class="readout">
              <div class="label">CANCEL</div>
              <div id="outCancel" class="status-pill">OFF</div>
            </div>
          </div>
        </div>
      </section>

      <section id="control" class="view">
        <div class="panel">
          <div class="steering-status">
            <div>
              <div class="label">ADCin living</div>
              <div id="controlAdc" class="value">0</div>
            </div>
            <button id="learnButton" class="learn-action" type="button">Learn</button>
          </div>
          <div class="switch-face">
            <div id="cruiseSwitches" class="switch-grid"></div>
          </div>
          <div id="controlMessage" class="message"></div>
        </div>
      </section>

      <section id="system" class="view">
        <div class="panel">
          <h2>Device</h2>
          <div class="grid two">
            <div class="metric">
              <div class="label">Wi-Fi SSID</div>
              <div class="value small">CC-S3</div>
            </div>
            <div class="metric">
              <div class="label">Wi-Fi Password</div>
              <div class="value small">ccs3setup</div>
            </div>
            <div class="metric">
              <div class="label">IP</div>
              <div class="value small">192.168.4.1</div>
            </div>
            <div class="metric">
              <div class="label">Firmware</div>
              <div class="value small">cruise-adc</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>設定JSON</h2>
          <textarea id="configJson" spellcheck="false"></textarea>
          <div class="json-actions">
            <button id="reloadConfig" type="button">再読込</button>
            <button id="resetConfig" class="danger" type="button">初期化</button>
            <button id="applyJson" class="primary" type="button">JSONを反映</button>
          </div>
          <div id="systemMessage" class="message"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const defaultStatus = {
      adc: 0,
      button: "NONE",
      pulseMs: 200,
      timing: { main: 200, res: 200, set: 200, cancel: 200 },
      outputs: { main: false, res: false, set: false, brake: false }
    };

    const defaultConfig = {
      pulseMs: 200,
      timing: {
        main: 200,
        res: 200,
        set: 200,
        cancel: 200
      },
      learned: {
        main: 0,
        cancel: 96,
        res: 153,
        set: 341
      }
    };

    const switchItems = [
      ["res", "u", "RES+"],
      ["main", "r", "MAIN"],
      ["cancel", "c", "CANCEL"],
      ["set", "d", "SET-"]
    ];

    let status = structuredClone(defaultStatus);
    let config = structuredClone(defaultConfig);
    let wsClient = null;
    let reconnectTimer = null;
    let learning = false;

    function shouldUseDeviceApi() {
      return location.hostname === "192.168.4.1" || location.hostname === "cc-s3.local" || location.hostname.endsWith(".local");
    }

    function normalizeStatus(next) {
      const pulseMs = Number(next?.pulseMs);
      const brake = Boolean(next?.outputs?.brake ?? next?.outputs?.brakeOut ?? next?.outputs?.cancel);
      return {
        adc: Number(next?.adc) || 0,
        button: String(next?.button || "NONE"),
        pulseMs: Number.isFinite(pulseMs) ? pulseMs : config.pulseMs,
        timing: normalizeTiming(next?.timing, Number.isFinite(pulseMs) ? pulseMs : config.pulseMs),
        outputs: {
          main: Boolean(next?.outputs?.main),
          res: Boolean(next?.outputs?.res ?? next?.outputs?.upSet),
          set: Boolean(next?.outputs?.set ?? next?.outputs?.downRes),
          brake
        }
      };
    }

    function normalizeMs(value, fallback = defaultConfig.pulseMs) {
      const ms = Number(value);
      return Number.isFinite(ms) ? Math.min(5000, Math.max(0, ms)) : fallback;
    }

    function normalizeTiming(next, fallback = defaultConfig.pulseMs) {
      return {
        main: normalizeMs(next?.main, fallback),
        res: normalizeMs(next?.res, fallback),
        set: normalizeMs(next?.set, fallback),
        cancel: normalizeMs(next?.cancel, fallback)
      };
    }

    function normalizeConfig(next) {
      const pulseMs = Number(next?.pulseMs);
      const basePulseMs = normalizeMs(pulseMs, defaultConfig.pulseMs);
      return {
        pulseMs: basePulseMs,
        timing: normalizeTiming(next?.timing, basePulseMs),
        learned: {
          main: Number.isFinite(Number(next?.learned?.main)) ? Number(next.learned.main) : defaultConfig.learned.main,
          cancel: Number.isFinite(Number(next?.learned?.cancel)) ? Number(next.learned.cancel) : defaultConfig.learned.cancel,
          res: Number.isFinite(Number(next?.learned?.res)) ? Number(next.learned.res) : defaultConfig.learned.res,
          set: Number.isFinite(Number(next?.learned?.set)) ? Number(next.learned.set) : defaultConfig.learned.set
        }
      };
    }

    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }

    function setPill(id, isOn) {
      const el = document.getElementById(id);
      el.textContent = isOn ? "ON" : "OFF";
      el.classList.toggle("on", Boolean(isOn));
    }

    function pulseOptionsHtml(key) {
      let html = "";
      const selectedMs = normalizeMs(config.timing?.[key], config.pulseMs);
      for (let ms = 0; ms <= 5000; ms += 100) {
        html += `<option value="${ms}"${ms === selectedMs ? " selected" : ""}>${ms} ms</option>`;
      }
      return html;
    }

    function render() {
      setText("statusAdc", status.adc);
      setText("statusButton", status.button);
      setText("controlAdc", status.adc);
      document.getElementById("configJson").value = JSON.stringify(config, null, 2);
      setPill("outMain", status.outputs.main);
      setPill("outRes", status.outputs.res);
      setPill("outSet", status.outputs.set);
      setPill("outCancel", status.outputs.brake);
      renderCruiseSwitches();
    }

    async function apiJson(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    async function loadConfig() {
      try {
        const next = shouldUseDeviceApi() ? await apiJson("/api/config") : JSON.parse(localStorage.getItem("cc-s3.config") || "{}");
        config = normalizeConfig(next);
      } catch {
        config = structuredClone(defaultConfig);
      }
      render();
    }

    async function saveConfig(key = null, pulseMs = config.pulseMs) {
      const value = Number(pulseMs);
      const nextTiming = { ...config.timing };
      if (key) {
        nextTiming[key] = Math.min(5000, Math.max(0, Number.isFinite(value) ? value : 200));
      }
      config = normalizeConfig({
        ...config,
        timing: nextTiming
      });
      localStorage.setItem("cc-s3.config", JSON.stringify(config));
      if (shouldUseDeviceApi()) {
        await apiJson("/api/config", { method: "POST", body: JSON.stringify(config) });
        config = normalizeConfig(await apiJson("/api/config"));
      }
      render();
    }

    async function loadStatus() {
      if (!shouldUseDeviceApi()) {
        status = normalizeStatus({ ...defaultStatus, pulseMs: config.pulseMs });
        render();
        return;
      }
      status = normalizeStatus(await apiJson("/api/status"));
      config.pulseMs = status.pulseMs;
      config.timing = status.timing;
      render();
    }

    async function learnSwitch(name) {
      config.learned[name] = status.adc;
      localStorage.setItem("cc-s3.config", JSON.stringify(config));
      if (shouldUseDeviceApi()) {
        config = normalizeConfig(await apiJson("/api/learn", {
          method: "POST",
          body: JSON.stringify({ name, adc: status.adc })
        }));
      }
      learning = false;
      render();
      document.getElementById("controlMessage").textContent = `${name.toUpperCase()} ADC ${status.adc}`;
    }

    function pulse(name) {
      const command = { type: "output", name, durationMs: normalizeMs(config.timing?.[name], config.pulseMs) };
      if (wsClient && wsClient.readyState === WebSocket.OPEN) {
        wsClient.send(JSON.stringify(command));
        return;
      }
      if (!shouldUseDeviceApi()) return;
      apiJson("/api/output", { method: "POST", body: JSON.stringify(command) })
        .then((next) => {
          status = normalizeStatus(next);
          render();
        })
        .catch(() => {});
    }

    function handleSwitchPress(name) {
      if (learning) {
        learnSwitch(name).catch(() => {
          document.getElementById("controlMessage").textContent = "学習に失敗しました";
        });
        return;
      }
      pulse(name);
    }

    function renderCruiseSwitches() {
      const root = document.getElementById("cruiseSwitches");
      if (!root) return;
      const renderKey = JSON.stringify({ learning, timing: config.timing, learned: config.learned });
      if (root.dataset.renderKey === renderKey) return;
      root.dataset.renderKey = renderKey;
      root.innerHTML = switchItems.map(([key, pos, label]) => `
        <div class="switch-item ${pos}">
          <button class="switch-control${learning ? " learning" : ""}" data-switch="${key}" type="button">
            <span class="switch-name">${label}</span>
          </button>
          <div class="switch-meta">
            <span>ADC${config.learned[key]}</span>
            <select class="switch-ms" data-pulse-ms="${key}" aria-label="${label} output time">
              ${pulseOptionsHtml(key)}
            </select>
          </div>
        </div>
      `).join("");
      root.querySelectorAll("[data-switch]").forEach((button) => {
        button.addEventListener("click", () => handleSwitchPress(button.dataset.switch));
      });
      root.querySelectorAll("[data-pulse-ms]").forEach((select) => {
        select.addEventListener("click", (event) => event.stopPropagation());
        select.addEventListener("change", (event) => {
          event.stopPropagation();
          saveConfig(event.currentTarget.dataset.pulseMs, event.currentTarget.value).catch(() => {
            document.getElementById("controlMessage").textContent = "保存に失敗しました";
          });
        });
      });
      document.getElementById("learnButton").classList.toggle("active", learning);
      document.getElementById("learnButton").textContent = learning ? "Learning" : "Learn";
    }

    function connectStatusSocket() {
      if (!shouldUseDeviceApi()) return;
      clearTimeout(reconnectTimer);
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      wsClient = new WebSocket(`${protocol}//${location.host}/ws`);
      wsClient.addEventListener("message", (event) => {
        try {
          status = normalizeStatus(JSON.parse(event.data));
          config.pulseMs = status.pulseMs;
          config.timing = status.timing;
          render();
        } catch {}
      });
      wsClient.addEventListener("close", () => {
        reconnectTimer = setTimeout(connectStatusSocket, 1200);
      });
    }

    function showMessage(id, message) {
      const el = document.getElementById(id);
      el.textContent = message;
      window.clearTimeout(el._timer);
      el._timer = window.setTimeout(() => { el.textContent = ""; }, 2400);
    }

    function bindEvents() {
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tab-button").forEach((item) => item.classList.toggle("active", item === button));
          document.querySelectorAll(".view").forEach((view) => view.classList.toggle("active", view.id === button.dataset.tab));
        });
      });

      document.getElementById("learnButton").addEventListener("click", () => {
        learning = !learning;
        document.getElementById("cruiseSwitches").dataset.renderKey = "";
        renderCruiseSwitches();
        document.getElementById("controlMessage").textContent = learning ? "学習する項目を押してください" : "";
      });

      document.getElementById("reloadConfig").addEventListener("click", () => {
        loadConfig().then(loadStatus).then(() => showMessage("systemMessage", "再読込しました"));
      });

      document.getElementById("applyJson").addEventListener("click", async () => {
        try {
          const next = JSON.parse(document.getElementById("configJson").value);
          config = normalizeConfig(next);
          await saveConfig();
          showMessage("systemMessage", "JSONを反映しました");
        } catch {
          showMessage("systemMessage", "JSON形式を確認してください");
        }
      });

      document.getElementById("resetConfig").addEventListener("click", async () => {
        config = structuredClone(defaultConfig);
        if (shouldUseDeviceApi()) {
          await apiJson("/api/reset", { method: "POST", body: "{}" });
        }
        localStorage.setItem("cc-s3.config", JSON.stringify(config));
        await loadStatus();
        showMessage("systemMessage", "初期化しました");
      });
    }

    bindEvents();
    render();
    loadConfig().then(loadStatus).catch(() => {});
    connectStatusSocket();
    setInterval(loadStatus, 1000);
  </script>
</body>
</html>
