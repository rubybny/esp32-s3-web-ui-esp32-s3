<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CC-S3</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #20242b;
      --muted: #6d7480;
      --line: #dfe3e8;
      --accent: #146ef5;
      --active: #18a058;
      --danger: #d64242;
      --shadow: 0 12px 30px rgba(20, 28, 40, .08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      touch-action: manipulation;
    }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: env(safe-area-inset-top) 14px 24px;
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 0;
      background: rgba(245, 246, 248, .92);
      backdrop-filter: blur(14px);
    }

    .tab {
      min-height: 46px;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
    }

    .tab.active {
      color: #fff;
      background: var(--ink);
    }

    .view {
      display: none;
      padding-top: 8px;
    }

    .view.active {
      display: block;
    }

    .section {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .section:last-child {
      border-bottom: 0;
    }

    .section-title {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .status {
      min-height: 86px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .status .name {
      color: var(--muted);
      font-size: 13px;
    }

    .status .state {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 500;
    }

    .status.on {
      border-color: rgba(24, 160, 88, .35);
      background: #f0fff7;
    }

    .status.on .state {
      color: var(--active);
    }

    .pulse-panel {
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .field label {
      color: var(--muted);
      font-size: 14px;
    }

    .field input {
      width: 132px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: #fff;
      text-align: right;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    .action {
      min-height: 76px;
      border-radius: 22px;
      color: #fff;
      background: var(--ink);
      box-shadow: var(--shadow);
      font-size: 23px;
      font-weight: 500;
      transition: transform .08s ease, background .12s ease;
    }

    .action:active {
      transform: scale(.985);
      background: var(--accent);
    }

    .action.brake {
      background: var(--danger);
    }

    .meta {
      display: grid;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    pre {
      overflow: auto;
      margin: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      color: #343942;
      font-size: 12px;
      line-height: 1.45;
    }

    .system-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .small-button {
      min-height: 48px;
      border-radius: 16px;
      color: #fff;
      background: var(--accent);
    }

    .small-button.danger {
      background: var(--danger);
    }

    .toast {
      min-height: 22px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (min-width: 560px) {
      .controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .action.brake {
        grid-column: span 2;
      }

      .status-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="tabs">
      <button class="tab active" data-tab="monitor" type="button">Monitor</button>
      <button class="tab" data-tab="control" type="button">Control</button>
      <button class="tab" data-tab="system" type="button">System</button>
    </nav>

    <section id="monitor" class="view active">
      <div class="section">
        <h2 class="section-title">Outputs</h2>
        <div class="status-grid">
          <div class="status" data-output-card="main"><div class="name">MAIN</div><div class="state">OFF</div></div>
          <div class="status" data-output-card="res"><div class="name">RES+</div><div class="state">OFF</div></div>
          <div class="status" data-output-card="set"><div class="name">SET-</div><div class="state">OFF</div></div>
          <div class="status" data-output-card="cancel"><div class="name">CANCEL</div><div class="state">OFF</div></div>
          <div class="status" data-output-card="brake"><div class="name">BRAKE</div><div class="state">OFF</div></div>
        </div>
      </div>
      <div class="section">
        <h2 class="section-title">Connection</h2>
        <div class="meta">
          <div class="row"><span>WebSocket</span><span id="wsState">Connecting</span></div>
          <div class="row"><span>Pulse</span><span><span id="pulseView">200</span> ms</span></div>
        </div>
      </div>
    </section>

    <section id="control" class="view">
      <div class="section">
        <h2 class="section-title">Pulse</h2>
        <div class="pulse-panel">
          <div class="field">
            <label for="pulseMs">出力時間</label>
            <input id="pulseMs" type="number" min="50" max="5000" step="50" value="200">
          </div>
          <button id="saveConfig" class="small-button" type="button">保存</button>
        </div>
        <div id="controlMessage" class="toast"></div>
      </div>

      <div class="section">
        <h2 class="section-title">Manual</h2>
        <div class="controls">
          <button class="action" data-pulse="main" type="button">MAIN</button>
          <button class="action" data-pulse="res" type="button">RES+</button>
          <button class="action" data-pulse="set" type="button">SET-</button>
          <button class="action" data-pulse="cancel" type="button">CANCEL</button>
          <button class="action brake" data-pulse="brake" type="button">BRAKE</button>
        </div>
      </div>
    </section>

    <section id="system" class="view">
      <div class="section">
        <h2 class="section-title">System</h2>
        <div class="meta">
          <div class="row"><span>SSID</span><span>CC-S3</span></div>
          <div class="row"><span>PASS</span><span>ccs3setup</span></div>
          <div class="row"><span>IP</span><span>192.168.4.1</span></div>
        </div>
      </div>
      <div class="section">
        <h2 class="section-title">Config</h2>
        <pre id="configJson">{}</pre>
        <div class="system-buttons" style="margin-top: 12px;">
          <button id="reloadConfig" class="small-button" type="button">再読込</button>
          <button id="resetConfig" class="small-button danger" type="button">初期化</button>
        </div>
        <div id="systemMessage" class="toast"></div>
      </div>
    </section>
  </main>

  <script>
    const defaultStatus = {
      pulseMs: 200,
      outputs: { main: false, res: false, set: false, cancel: false, brake: false }
    };

    let status = structuredClone(defaultStatus);
    let config = { pulseMs: 200 };
    let ws = null;
    let reconnectTimer = null;

    const outputKeys = ["main", "res", "set", "cancel", "brake"];

    function normalizeStatus(next) {
      return {
        pulseMs: Number(next?.pulseMs) || config.pulseMs || 200,
        outputs: {
          main: Boolean(next?.outputs?.main),
          res: Boolean(next?.outputs?.res ?? next?.outputs?.upSet),
          set: Boolean(next?.outputs?.set ?? next?.outputs?.downRes),
          cancel: Boolean(next?.outputs?.cancel),
          brake: Boolean(next?.outputs?.brake ?? next?.outputs?.brakeOut)
        }
      };
    }

    function render() {
      outputKeys.forEach((key) => {
        const card = document.querySelector(`[data-output-card="${key}"]`);
        const on = Boolean(status.outputs[key]);
        card.classList.toggle("on", on);
        card.querySelector(".state").textContent = on ? "ON" : "OFF";
      });
      document.getElementById("pulseView").textContent = String(status.pulseMs);
      document.getElementById("pulseMs").value = String(config.pulseMs);
      document.getElementById("configJson").textContent = JSON.stringify(config, null, 2);
    }

    async function apiJson(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function loadConfig() {
      try {
        const next = await apiJson("/api/config");
        config = { pulseMs: Number(next.pulseMs) || 200 };
        render();
      } catch {
        config = { pulseMs: 200 };
        render();
      }
    }

    async function saveConfig() {
      const value = Number(document.getElementById("pulseMs").value);
      const pulseMs = Math.min(5000, Math.max(50, Number.isFinite(value) ? value : 200));
      config = { pulseMs };
      await apiJson("/api/config", { method: "POST", body: JSON.stringify(config) });
      document.getElementById("controlMessage").textContent = "保存しました";
      render();
    }

    async function loadStatus() {
      const next = await apiJson("/api/status");
      status = normalizeStatus(next);
      render();
    }

    function pulse(name) {
      const command = { type: "output", name, durationMs: config.pulseMs };
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(command));
        return;
      }
      apiJson("/api/output", { method: "POST", body: JSON.stringify(command) })
        .then((next) => {
          status = normalizeStatus(next);
          render();
        })
        .catch(() => {});
    }

    function connectWs() {
      clearTimeout(reconnectTimer);
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${location.host}/ws`);
      document.getElementById("wsState").textContent = "Connecting";

      ws.addEventListener("open", () => {
        document.getElementById("wsState").textContent = "Online";
      });

      ws.addEventListener("message", (event) => {
        try {
          status = normalizeStatus(JSON.parse(event.data));
          config.pulseMs = status.pulseMs;
          render();
        } catch {}
      });

      ws.addEventListener("close", () => {
        document.getElementById("wsState").textContent = "Offline";
        reconnectTimer = setTimeout(connectWs, 1200);
      });

      ws.addEventListener("error", () => {
        document.getElementById("wsState").textContent = "Error";
      });
    }

    function bindUi() {
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-tab]").forEach((item) => item.classList.toggle("active", item === button));
          document.querySelectorAll(".view").forEach((view) => view.classList.toggle("active", view.id === button.dataset.tab));
        });
      });

      document.querySelectorAll("[data-pulse]").forEach((button) => {
        button.addEventListener("click", () => pulse(button.dataset.pulse));
      });

      document.getElementById("saveConfig").addEventListener("click", () => {
        saveConfig().catch(() => {
          document.getElementById("controlMessage").textContent = "保存に失敗しました";
        });
      });

      document.getElementById("reloadConfig").addEventListener("click", () => {
        loadConfig().then(loadStatus).catch(() => {
          document.getElementById("systemMessage").textContent = "再読込に失敗しました";
        });
      });

      document.getElementById("resetConfig").addEventListener("click", async () => {
        await apiJson("/api/reset", { method: "POST", body: "{}" });
        await loadConfig();
        document.getElementById("systemMessage").textContent = "初期化しました";
      });
    }

    bindUi();
    render();
    loadConfig().then(loadStatus).catch(() => {});
    connectWs();
  </script>
</body>
</html>
