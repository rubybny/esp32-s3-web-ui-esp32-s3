<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CC-S3 Cruise Unit</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --line: #dde5ee;
      --text: #17202c;
      --muted: #637083;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
      --off: #d5dde6;
      --radius: 8px;
      --shadow: 0 12px 28px rgba(17, 24, 39, .08);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.45;
    }

    button, input, textarea { font: inherit; }

    button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text);
      padding: 12px 14px;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: translateY(1px); }

    button.primary {
      border-color: rgba(37, 99, 235, .52);
      background: var(--accent);
      color: #f8fdff;
    }

    button.danger {
      border-color: rgba(220, 38, 38, .75);
      background: #fee2e2;
      color: #8d1f1f;
    }

    input[type="number"], textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--text);
      padding: 12px;
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre;
    }

    .app {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 8px 0 12px;
      background: rgba(246, 248, 251, .92);
      backdrop-filter: blur(12px);
    }

    .tab-button {
      min-height: 52px;
      padding: 8px 4px;
      color: var(--muted);
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(17, 24, 39, .05);
    }

    .tab-button.active {
      color: #ffffff;
      border-color: var(--accent);
      background: var(--accent);
    }

    main, .view {
      display: grid;
      gap: 14px;
    }

    .view { display: none; }
    .view.active { display: grid; }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 21px;
      font-weight: 540;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metric {
      display: grid;
      min-height: 86px;
      align-content: space-between;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      padding: 12px;
    }

    .label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .value {
      overflow-wrap: anywhere;
      font-size: 26px;
      font-weight: 540;
      line-height: 1.1;
    }

    .value.small { font-size: 20px; }

    .status-pill {
      display: inline-grid;
      place-items: center;
      width: fit-content;
      min-width: 70px;
      min-height: 34px;
      border-radius: 999px;
      padding: 5px 11px;
      background: var(--off);
      color: #334155;
      font-size: 16px;
      font-weight: 520;
    }

    .status-pill.on {
      background: var(--ok);
      color: #ffffff;
    }

    .control-grid {
      display: grid;
      gap: 10px;
    }

    .control-button {
      min-height: 74px;
      font-size: 22px;
      background: #ffffff;
    }

    .control-button.cancel {
      border-color: rgba(220, 38, 38, .28);
      background: #fff7f7;
      color: #9f1d1d;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 10px;
      align-items: center;
    }

    .json-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .message {
      min-height: 26px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 500;
      margin-top: 10px;
    }

    @media (min-width: 720px) {
      .app { padding-inline: 22px; }
      .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid.four, .control-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav class="tabs" aria-label="画面切り替え">
      <button class="tab-button active" data-tab="monitor" type="button">Monitor</button>
      <button class="tab-button" data-tab="control" type="button">Control</button>
      <button class="tab-button" data-tab="system" type="button">System</button>
    </nav>

    <main>
      <section id="monitor" class="view active">
        <div class="panel">
          <h2>Input</h2>
          <div class="grid two">
            <div class="metric">
              <div class="label">ADC GPIO4</div>
              <div id="statusAdc" class="value">0</div>
            </div>
            <div class="metric">
              <div class="label">Button</div>
              <div id="statusButton" class="value small">NONE</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>Outputs</h2>
          <div class="grid two four">
            <div class="metric">
              <div class="label">MAIN</div>
              <div id="outMain" class="status-pill">OFF</div>
            </div>
            <div class="metric">
              <div class="label">RES+</div>
              <div id="outRes" class="status-pill">OFF</div>
            </div>
            <div class="metric">
              <div class="label">SET-</div>
              <div id="outSet" class="status-pill">OFF</div>
            </div>
            <div class="metric">
              <div class="label">CANCEL</div>
              <div id="outCancel" class="status-pill">OFF</div>
            </div>
          </div>
        </div>
      </section>

      <section id="control" class="view">
        <div class="panel">
          <h2>Pulse</h2>
          <div class="field-row">
            <div>
              <div class="label">出力時間</div>
              <div class="value small"><span id="pulseView">200</span> ms</div>
            </div>
            <input id="pulseMs" type="number" min="50" max="5000" step="50" value="200">
          </div>
          <button id="saveConfig" class="primary" type="button" style="margin-top: 10px;">保存</button>
          <div id="controlMessage" class="message"></div>
        </div>

        <div class="panel">
          <h2>Manual</h2>
          <div class="control-grid">
            <button class="control-button" data-pulse="main" type="button">MAIN</button>
            <button class="control-button" data-pulse="res" type="button">RES+</button>
            <button class="control-button" data-pulse="set" type="button">SET-</button>
            <button class="control-button cancel" data-pulse="cancel" type="button">CANCEL</button>
          </div>
        </div>
      </section>

      <section id="system" class="view">
        <div class="panel">
          <h2>Device</h2>
          <div class="grid two">
            <div class="metric">
              <div class="label">Wi-Fi SSID</div>
              <div class="value small">CC-S3</div>
            </div>
            <div class="metric">
              <div class="label">Wi-Fi Password</div>
              <div class="value small">ccs3setup</div>
            </div>
            <div class="metric">
              <div class="label">IP</div>
              <div class="value small">192.168.4.1</div>
            </div>
            <div class="metric">
              <div class="label">Firmware</div>
              <div class="value small">cruise-adc</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>設定JSON</h2>
          <textarea id="configJson" spellcheck="false"></textarea>
          <div class="json-actions">
            <button id="reloadConfig" type="button">再読込</button>
            <button id="resetConfig" class="danger" type="button">初期化</button>
            <button id="applyJson" class="primary" type="button">JSONを反映</button>
          </div>
          <div id="systemMessage" class="message"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const defaultStatus = {
      adc: 0,
      button: "NONE",
      pulseMs: 200,
      outputs: { main: false, res: false, set: false, brake: false }
    };

    let status = structuredClone(defaultStatus);
    let config = { pulseMs: 200 };
    let wsClient = null;
    let reconnectTimer = null;

    function shouldUseDeviceApi() {
      return location.hostname === "192.168.4.1" || location.hostname === "cc-s3.local" || location.hostname.endsWith(".local");
    }

    function normalizeStatus(next) {
      const brake = Boolean(next?.outputs?.brake ?? next?.outputs?.brakeOut ?? next?.outputs?.cancel);
      return {
        adc: Number(next?.adc) || 0,
        button: String(next?.button || "NONE"),
        pulseMs: Number(next?.pulseMs) || config.pulseMs || 200,
        outputs: {
          main: Boolean(next?.outputs?.main),
          res: Boolean(next?.outputs?.res ?? next?.outputs?.upSet),
          set: Boolean(next?.outputs?.set ?? next?.outputs?.downRes),
          brake
        }
      };
    }

    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }

    function setPill(id, isOn) {
      const el = document.getElementById(id);
      el.textContent = isOn ? "ON" : "OFF";
      el.classList.toggle("on", Boolean(isOn));
    }

    function render() {
      setText("statusAdc", status.adc);
      setText("statusButton", status.button);
      setText("pulseView", status.pulseMs);
      document.getElementById("pulseMs").value = String(config.pulseMs);
      document.getElementById("configJson").value = JSON.stringify(config, null, 2);
      setPill("outMain", status.outputs.main);
      setPill("outRes", status.outputs.res);
      setPill("outSet", status.outputs.set);
      setPill("outCancel", status.outputs.brake);
    }

    async function apiJson(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }

    async function loadConfig() {
      try {
        const next = shouldUseDeviceApi() ? await apiJson("/api/config") : JSON.parse(localStorage.getItem("cc-s3.config") || "{}");
        config = { pulseMs: Number(next.pulseMs) || 200 };
      } catch {
        config = { pulseMs: 200 };
      }
      render();
    }

    async function saveConfig() {
      const value = Number(document.getElementById("pulseMs").value);
      config = { pulseMs: Math.min(5000, Math.max(50, Number.isFinite(value) ? value : 200)) };
      localStorage.setItem("cc-s3.config", JSON.stringify(config));
      if (shouldUseDeviceApi()) {
        await apiJson("/api/config", { method: "POST", body: JSON.stringify(config) });
      }
      document.getElementById("controlMessage").textContent = "保存しました";
      render();
    }

    async function loadStatus() {
      if (!shouldUseDeviceApi()) {
        status = normalizeStatus({ ...defaultStatus, pulseMs: config.pulseMs });
        render();
        return;
      }
      status = normalizeStatus(await apiJson("/api/status"));
      config.pulseMs = status.pulseMs;
      render();
    }

    function pulse(name) {
      const command = { type: "output", name, durationMs: config.pulseMs };
      if (wsClient && wsClient.readyState === WebSocket.OPEN) {
        wsClient.send(JSON.stringify(command));
        return;
      }
      if (!shouldUseDeviceApi()) return;
      apiJson("/api/output", { method: "POST", body: JSON.stringify(command) })
        .then((next) => {
          status = normalizeStatus(next);
          render();
        })
        .catch(() => {});
    }

    function connectStatusSocket() {
      if (!shouldUseDeviceApi()) return;
      clearTimeout(reconnectTimer);
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      wsClient = new WebSocket(`${protocol}//${location.host}/ws`);
      wsClient.addEventListener("message", (event) => {
        try {
          status = normalizeStatus(JSON.parse(event.data));
          config.pulseMs = status.pulseMs;
          render();
        } catch {}
      });
      wsClient.addEventListener("close", () => {
        reconnectTimer = setTimeout(connectStatusSocket, 1200);
      });
    }

    function showMessage(id, message) {
      const el = document.getElementById(id);
      el.textContent = message;
      window.clearTimeout(el._timer);
      el._timer = window.setTimeout(() => { el.textContent = ""; }, 2400);
    }

    function bindEvents() {
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tab-button").forEach((item) => item.classList.toggle("active", item === button));
          document.querySelectorAll(".view").forEach((view) => view.classList.toggle("active", view.id === button.dataset.tab));
        });
      });

      document.querySelectorAll("[data-pulse]").forEach((button) => {
        button.addEventListener("click", () => pulse(button.dataset.pulse));
      });

      document.getElementById("saveConfig").addEventListener("click", () => {
        saveConfig().catch(() => {
          document.getElementById("controlMessage").textContent = "保存に失敗しました";
        });
      });

      document.getElementById("reloadConfig").addEventListener("click", () => {
        loadConfig().then(loadStatus).then(() => showMessage("systemMessage", "再読込しました"));
      });

      document.getElementById("applyJson").addEventListener("click", async () => {
        try {
          const next = JSON.parse(document.getElementById("configJson").value);
          config = { pulseMs: Number(next.pulseMs) || 200 };
          await saveConfig();
          showMessage("systemMessage", "JSONを反映しました");
        } catch {
          showMessage("systemMessage", "JSON形式を確認してください");
        }
      });

      document.getElementById("resetConfig").addEventListener("click", async () => {
        config = { pulseMs: 200 };
        if (shouldUseDeviceApi()) {
          await apiJson("/api/reset", { method: "POST", body: "{}" });
        }
        localStorage.setItem("cc-s3.config", JSON.stringify(config));
        await loadStatus();
        showMessage("systemMessage", "初期化しました");
      });
    }

    bindEvents();
    render();
    loadConfig().then(loadStatus).catch(() => {});
    connectStatusSocket();
    setInterval(loadStatus, 1000);
  </script>
</body>
</html>
